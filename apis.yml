aid: pathos
name: Pathos
description: 'Pathos (Pathos AI, Inc.) is an AI-enabled, clinical-stage biotechnology
  company founded in 2022 by Eric Lefkofsky and Ryan Fukushima that applies artificial
  intelligence and large-scale multimodal patient data to oncology drug development.
  Its PathOS platform is organized around three engines — Scout (AI asset selection
  that matches an investigational therapy to the patient subgroup most likely to respond),
  Sprint (small autonomous clinical-execution pods that design and run biomarker-driven
  trials), and Foundry (the oncology foundation model built in partnership with Tempus
  and AstraZeneca) — trained against a stated corpus of more than 200 petabytes of
  multimodal clinical, molecular and imaging data linked to patient outcomes. The company
  raised a $365M Series D in May 2025 at roughly a $1.6B valuation, completed the acquisition
  of Rain Oncology, and is advancing a precision-oncology pipeline that includes a
  CBP/p300 inhibitor and a brain-penetrant PRMT5 inhibitor. Pathos sells partnership
  and co-development to pharma and biotech; it publishes no public developer program,
  API, SDK or machine-readable specification.'
